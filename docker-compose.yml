version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: gaas-postgres
    restart: always
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: gitea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gaas-network

  gitea:
    image: gitea/gitea:latest
    container_name: gaas-gitea
    depends_on:
      - postgres
    restart: always
    environment:
      USER_UID: 1000
      USER_GID: 1000
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - ./gitea/app.ini:/data/gitea/conf/app.ini
      - ./gitea/custom:/data/gitea/custom
    networks:
      - gaas-network

volumes:
  postgres-data:
  gitea-data:

networks:
  gaas-network: